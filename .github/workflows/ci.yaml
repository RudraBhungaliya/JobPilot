name: CI Workflow

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# 1. Add defaults here to apply working directory to all steps:
defaults:
  run:
    working-directory: ./apps/web

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          # 2. Add cache-dependency-path here:
          cache-dependency-path: 'apps/web/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile